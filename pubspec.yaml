name: bloc_clean_arch_flutter
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # Value equality + functional error handling
  equatable: ^3.0.0
  fpdart: ^1.2.0

  # Dependency injection
  get_it: ^9.3.0

  # Networking
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  connectivity_plus: ^7.3.1

  # Local storage
  # drift is capped below 2.35.0: from that version on, drift_dev requires an
  # analyzer newer than the Flutter SDK's pinned test_api allows alongside
  # bloc_test. Raise both drift and drift_dev together when the SDK moves.
  drift: ">=2.34.0 <2.35.0"
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0

  # UI
  cached_network_image: ^4.0.0
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Code generation
  build_runner: ^2.15.1
  retrofit_generator: ^10.2.9
  json_serializable: ^6.14.1
  drift_dev: ">=2.34.0 <2.35.0"

flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
